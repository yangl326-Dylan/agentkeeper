name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift (toolchain bundled with runner Xcode)
        run: swift --version

      - name: Build (all targets, zero warnings expected)
        run: swift build 2>&1 | tee build.log
        # 0-warning 纪律：有 warning 即失败
      - name: Fail on warnings
        run: "! grep -E 'warning:' build.log"

      - name: Test
        run: swift test --verbose

      - name: Build GUI app bundle
        run: scripts/build-app.sh release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentKeeper-app
          path: AgentKeeper.app

  release:
    name: Release (tag v*)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build release binaries
        run: |
          swift build -c release
          scripts/build-app.sh release
          mkdir -p dist
          cp .build/release/ak dist/ak
          zip -qry AgentKeeper-cli-macos.zip ak -x '*.DS_Store'
          zip -qry AgentKeeper-app-macos.zip AgentKeeper.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AgentKeeper-cli-macos.zip
            AgentKeeper-app-macos.zip
