name: CI

# Release 用 softprops/action-gh-release 创建 Release 需要 contents 写权限
# （默认 GITHUB_TOKEN 只读 → "Resource not accessible by integration"）。
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift (toolchain bundled with runner Xcode)
        run: swift --version

      - name: Build (all targets, zero warnings expected)
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
        # 0-warning 纪律：有 warning 即失败（pipefail 保证 swift build 失败不吞）
      - name: Fail on warnings
        run: "! grep -E 'warning:' build.log"

      - name: Test
        # macos-15 runner 上 swift-testing 执行器偶发整进程楔死（曾实证两轮挂起，
        # 且楔死集合横跨纯同步测试——执行器级 flake，非测试缺陷）。自动重试一次，
        # 重开进程即恢复；timeout_minutes 内未完成按失败处理。
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          retry_wait_seconds: 5
          timeout_minutes: 12
          command: swift test --verbose

      - name: Build GUI app bundle
        run: scripts/build-app.sh release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentKeeper-app
          path: AgentKeeper.app

  test-linux:
    # 平台无关纪律防线：core（DomainKit/InfraKit/AppCore）+ ak 必须在 Linux 全绿。
    # Package.swift 在 Linux 上只声明平台无关目标（macOS UI 目标被 #if os(macOS) 排除）。
    name: Test & Build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # swift 工具链运行/构建依赖 + 本仓库 libsqlite3
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          binutils libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev
          libpython3-dev libsqlite3-dev libstdc++-13-dev libxml2-dev libz3-dev
          pkg-config zlib1g-dev

      # 官方 tarball 直装（unstripped 布局保留 usr/ 前缀——工具链自定位依赖它；
      # setup-swift 版本清单滞后不认 6.2.x 补丁版；6.2.1 有 libswiftObservation 链接缺陷，
      # 6.2.4 本地实测修复。6.4+ 默认 SwiftBuild 引擎有 Linux 资源包缺陷，升级前先验证）
      - name: Install Swift 6.2.4 (official tarball)
        run: |
          set -e
          curl -L --retry 3 -sS -o /tmp/swift.tar.gz \
            "https://download.swift.org/swift-6.2.4-release/ubuntu2404/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-ubuntu24.04.tar.gz"
          mkdir -p /opt/swift && tar -xzf /tmp/swift.tar.gz -C /opt/swift
          echo "/opt/swift/swift-6.2.4-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"

      - name: Verify Swift
        run: swift --version

      - name: Build (platform-neutral targets, zero warnings expected)
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log

      - name: Fail on warnings
        run: "! grep -E 'warning:' build.log"

      - name: Test
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          retry_wait_seconds: 5
          timeout_minutes: 12
          command: swift test --verbose

      - name: Smoke ak CLI
        run: |
          "$(swift build --show-bin-path)/ak" help

  release:
    name: Release (tag v*)
    needs: [test, test-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build release binaries
        run: |
          set -euo pipefail
          # UNIVERSAL=1:发布产物 arm64+x86_64 双架构(所有 Mac 用户可用)
          export UNIVERSAL=1
          swift build -c release --arch arm64 --arch x86_64
          scripts/build-app.sh release
          mkdir -p dist
          # universal 产物在 .build/apple/Products/Release；路径必须用 --show-bin-path 取
          BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          cp "$BIN_DIR/ak" dist/ak
          (cd dist && zip -qry ../AgentKeeper-cli-macos.zip ak -x '*.DS_Store')
          zip -qry AgentKeeper-app-macos.zip AgentKeeper.app

      - name: Build Linux CLI release
        run: |
          set -euo pipefail
          # Linux CLI：静态链接 Swift 运行时（免工具链运行）；系统依赖仅 glibc/libsqlite3
          swift build -c release --product ak --static-swift-stdlib
          BIN_DIR="$(swift build -c release --product ak --static-swift-stdlib --show-bin-path)"
          mkdir -p dist-linux
          cp "$BIN_DIR/ak" dist-linux/ak
          (cd dist-linux && zip -qry ../AgentKeeper-cli-linux-ubuntu24.04.zip ak)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AgentKeeper-cli-macos.zip
            AgentKeeper-app-macos.zip
            AgentKeeper-cli-linux-ubuntu24.04.zip
