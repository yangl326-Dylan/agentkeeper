name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Swift (toolchain bundled with runner Xcode)
        run: swift --version

      - name: Build (all targets, zero warnings expected)
        run: swift build 2>&1 | tee build.log
        # 0-warning 纪律：有 warning 即失败
      - name: Fail on warnings
        run: "! grep -E 'warning:' build.log"

      - name: Test
        # macos-15 runner 上 swift-testing 执行器偶发整进程楔死（曾实证两轮挂起，
        # 且楔死集合横跨纯同步测试——执行器级 flake，非测试缺陷）。自动重试一次，
        # 重开进程即恢复；timeout_minutes 内未完成按失败处理。
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          retry_wait_seconds: 5
          timeout_minutes: 12
          command: swift test --verbose

      - name: Build GUI app bundle
        run: scripts/build-app.sh release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentKeeper-app
          path: AgentKeeper.app

  release:
    name: Release (tag v*)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build release binaries
        run: |
          set -euo pipefail
          swift build -c release
          scripts/build-app.sh release
          mkdir -p dist
          # 产物路径随三元组变化（CI 为 arm64-apple-macosx），必须用 --show-bin-path 取
          BIN_DIR="$(swift build -c release --show-bin-path)"
          cp "$BIN_DIR/ak" dist/ak
          (cd dist && zip -qry ../AgentKeeper-cli-macos.zip ak -x '*.DS_Store')
          zip -qry AgentKeeper-app-macos.zip AgentKeeper.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AgentKeeper-cli-macos.zip
            AgentKeeper-app-macos.zip
